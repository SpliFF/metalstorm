name: Security — SPRING_PROD gate
#
# PLAN-security-hardening.md task 2: "an automated 'did the flag actually
# gate it' test — belt and braces against a refactor quietly re-including a
# file." Builds spring-server/spring-lobby/spring-logserver twice (dev and
# -DSPRING_PROD=ON) and asserts the gated dev/debug/exec route strings are
# present in the dev binaries (sanity check the grep pattern is meaningful)
# and absent from the prod binaries (the actual gate).
#
# Platform note: this repo's QUIC stack (rts/CMakeLists.txt — ngtcp2/
# ngtcp2_crypto_ossl/nghttp3) is currently wired to Homebrew pkg-config paths
# only; there is no Linux FetchContent fallback implemented yet (the
# CMakeLists.txt comment names SPRING_QUIC_FETCHCONTENT as the future
# escape hatch, but it doesn't exist in code). `cmake` cannot configure this
# project on a stock ubuntu-latest runner today for that reason alone — every
# other GitHub Actions workflow in this repo that touches the C++ build
# (engine-build.yml) is upstream RecoilEngine tooling gated to a different
# repository and a Docker image this fork's CMakeLists.txt has drifted from
# (its configure.sh passes -DAI_EXCLUDE_REGEX/-DUSERDOCS_PLAIN, options that
# don't exist here). Runs on macos-14 instead, mirroring local dev exactly.

on:
  pull_request:
    paths:
      - 'rts/**'
      - 'CMakeLists.txt'
      - '.github/workflows/security-prod-gate.yml'
  push:
    branches: [main]
    paths:
      - 'rts/**'
      - 'CMakeLists.txt'
  workflow_dispatch:

jobs:
  prod-gate:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          set -e
          # Formula names are libngtcp2 / libnghttp3, NOT ngtcp2 / nghttp3 —
          # the latter don't exist in homebrew-core and made every run of this
          # workflow between 2026-07-11 and 2026-08-03 die here in ~20 s,
          # before it ever reached the assertions below. Keep them in sync with
          # CMakeLists.txt's `foreach(_qpkg libngtcp2 libngtcp2_crypto_ossl
          # libnghttp3)` prefix probe, which is what actually has to find them.
          brew install cmake ninja libngtcp2 libnghttp3 openssl@3
          # The QUIC TLS path needs OpenSSL >= 3.5; the runner image ships its
          # own openssl@3 and `brew install` is a no-op on an already-installed
          # older one, so upgrade explicitly and assert the version rather than
          # failing later inside ngtcp2_crypto_ossl with a confusing error.
          brew upgrade openssl@3 || true
          "$(brew --prefix openssl@3)/bin/openssl" version
          pkg-config --version

      - name: Configure + build (dev — sanity control)
        run: |
          cmake --preset release -B build/dev-control -DSPRING_SKIP_AUDIOCONVERTER=ON
          cmake --build build/dev-control --target spring-server spring-lobby spring-logserver -j 4

      - name: Configure + build (SPRING_PROD=ON — the actual gate)
        run: |
          cmake --preset release -B build/prod -DSPRING_PROD=ON -DSPRING_SKIP_AUDIOCONVERTER=ON
          cmake --build build/prod --target spring-server spring-lobby spring-logserver -j 4

      # Scope of this assertion list, stated because it has not grown since the
      # gate was written and that looks like drift rather than design:
      # only routes whose *capability* has no place in a production binary are
      # compile-gated — arbitrary Lua/SQL exec, PID/port disclosure, and the
      # logserver's unauthenticated ingest/restart. Routes added since
      # (`/api/gm/*`, `/api/admin/*`, `/api/client-errors`) are deliberately NOT
      # in this list: they are operational surface a production deployment needs
      # to *have*, so they are gated at runtime by `RouteAuth::AdminOnly` /
      # `TokenRequired` (default-deny, enforced centrally in
      # NetworkServer::DispatchPost) rather than compiled away. The
      # complementary check for those is the route-table snapshot doctest in the
      # ctest step below, which fails if a route is registered without a
      # classification: RouteAuth is a mandatory argument to
      # AddHttpGet/AddHttpPost, so an unclassified route is a compile error, and
      # tests/test_route_auth.cpp pins that mechanism. (Note what that does NOT
      # cover: nothing snapshots the *real* lobby/server route inventory against
      # PLAN-security-hardening.md §1.1 — lobby_main.cpp registers its routes
      # inline in main(), so there is nothing to call from a unit test. See the
      # header comment in test_route_auth.cpp.) If you add a route that runs
      # arbitrary code or discloses infrastructure, it belongs here as well.
      - name: Verify gated routes are compiled out under SPRING_PROD
        run: |
          set -e

          # (binary, [route strings that must be gone under SPRING_PROD])
          check() {
            local dev_bin="$1" prod_bin="$2"; shift 2
            for route in "$@"; do
              if ! strings "$dev_bin" | grep -qF -- "$route"; then
                echo "SANITY FAIL: '$route' not found in dev build ($dev_bin) — grep pattern is vacuous, fix the test"
                exit 1
              fi
              if strings "$prod_bin" | grep -qF -- "$route"; then
                echo "GATE FAIL: '$route' is still present in the SPRING_PROD binary ($prod_bin)"
                exit 1
              fi
              echo "OK: '$route' present in dev, absent from prod ($prod_bin)"
            done
          }

          check build/dev-control/spring-server build/prod/spring-server \
            "/api/exec"

          check build/dev-control/spring-lobby build/prod/spring-lobby \
            "/api/exec" "/api/processes"

          check build/dev-control/spring-logserver build/prod/spring-logserver \
            "/api/logs/ingest" "/api/logs/test-event" "/api/logs/restart"

      - name: ctest (doctest suite — independent of SPRING_PROD)
        run: |
          cmake --build build/dev-control --target spring-tests -j 4
          ctest --test-dir build/dev-control --output-on-failure
