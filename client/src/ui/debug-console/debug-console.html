<div id="debug-console" class="debug-console hidden">
    <div class="debug-console-tab-bar">
        <div id="debug-tab-list" class="debug-tab-list"></div>
        <button id="debug-tab-add" class="debug-tab-add" title="New tab">+</button>
        <div class="debug-tab-spacer"></div>
        <div class="debug-console-controls">
            <label title="Log network messages"><input id="debug-net-toggle" type="checkbox" /> Net</label>
            <span id="debug-status" class="debug-status disconnected" title="Log server connection">&#x25cf;</span>
            <button id="debug-close-btn" title="Close console">&times;</button>
        </div>
    </div>
    <div id="debug-tab-panels" class="debug-tab-panels"></div>
</div>
