<div class="player-row {{ready_class}}">
    <span class="player-icon">{{host_icon}}</span>
    <span class="player-name">{{name}}</span>
    <select class="team-select" name="team-pid-{{pid}}" data-pid="{{pid}}"{{select_disabled}}>
        <option value="0"{{team0_selected}}>Team 1</option>
        <option value="1"{{team1_selected}}>Team 2</option>
    </select>
    {{startpos_html}}
    <span class="player-status">{{status}}</span>
</div>
