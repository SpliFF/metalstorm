<div class="lobby-card">
    <h1>Spring RTS Web</h1>
    <form id="login-form" class="lobby-form">
        <input type="text" id="login-user" placeholder="Username" autofocus>
        <input type="password" id="login-pass" placeholder="Password">
        <input type="password" id="login-pass2" placeholder="Confirm password (new accounts)">
        <div id="login-faction-group" class="login-faction-group hidden">
            <select id="login-faction" class="game-select">
                <option value="">Choose your faction…</option>
            </select>
            <p id="login-faction-desc" class="hint login-faction-desc"></p>
        </div>
        <!-- Two-factor challenge (PLAN-metalstorm-lobby.md §7.2, task 8d).
             Hidden until the server answers a correct password with
             `totp_required` — an always-visible code field would ask every
             player on every login for something almost none of them have, and
             would read as "this account needs a code" when it does not. -->
        <div id="login-totp-group" class="login-totp-group hidden">
            <input type="text" id="login-totp" inputmode="numeric" autocomplete="one-time-code"
                   placeholder="6-digit code (or a recovery code)">
            <p class="hint">From your authenticator app.</p>
        </div>
        <button type="submit" id="login-btn">Login / Register</button>
        <p id="login-msg" class="msg"></p>
        <p class="hint">New username? Enter a password twice to register.</p>
    </form>
</div>
