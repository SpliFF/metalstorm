<div class="lobby-panel">
    <div class="lobby-header">
        <h2>Game Rooms</h2>
        <button id="create-room-btn">+ New Game</button>
        <!-- Replay browser (PLAN-replay.md task 4c). Hidden entirely on a
             lobby that is not recording — /api/replays/list 404s there, and an
             empty "Replays" panel would read as a broken feature rather than
             an unconfigured one. -->
        <button id="show-replays-btn" style="display:none">▶ Replays</button>
        <!-- Account + logout (PLAN-endtoend.md D45). Until this existed the
             only way off an account was clearing localStorage by hand, so a
             shared machine could not be handed over. `account_name` is
             pre-escaped by the caller. -->
        <span class="lobby-account" id="account-name">{{account_name}}</span>
        <button id="logout-btn" class="secondary">Log out</button>
    </div>
    <div id="room-list" class="room-list"></div>
    <div id="replay-panel" class="replay-panel" style="display:none">
        <h3>Replays</h3>
        <div id="replay-list" class="replay-list"></div>
    </div>
    <div id="create-form" class="create-form" style="display:none">
        <h3>Create Game</h3>
        <input type="text" id="new-room-name" placeholder="Room name" value="My Game">
        <div class="map-select-label">Game:</div>
        <select id="game-select" class="game-select" disabled>
            <option value="">Loading games…</option>
        </select>
        <div class="map-select-label">Map:</div>
        <div id="map-selector" class="map-grid">
            <div class="empty-state">Loading maps...</div>
        </div>
        <!-- Scenario ("war") picker, PLAN-endtoend.md D10. Hidden entirely
             for games that ship no scenarios (Paper Tanks, ZK) so their
             create form is unchanged. Repopulated whenever the game or map
             selection changes; the default is the map's own war. -->
        <div id="scenario-row" style="display:none">
            <div class="map-select-label">War:</div>
            <select id="scenario-select" class="game-select"></select>
            <div id="scenario-note" class="scenario-note"></div>
        </div>
        <div class="btn-row">
            <button id="do-create-btn" class="primary">Create</button>
            <button id="cancel-create-btn" class="secondary">Cancel</button>
        </div>
    </div>
</div>
