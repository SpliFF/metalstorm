<div class="replay-entry">
    <div class="replay-main">
        <span class="replay-title">{{title}}</span>
        <span class="replay-badge">{{outcome}}</span>
    </div>
    <div class="replay-players">{{players}}</div>
    <div class="replay-detail">{{detail}}</div>
    <button class="watch-btn" data-file="{{file}}"{{disabled_attr}}>{{watch_label}}</button>
</div>
