<div id="hud-top-bar" class="hud-panel" style="display:none">
    <!-- Quit moved to ESC; entity/frame counters/minimap kept for hot-swap of -->
    <!-- HUD overlays in the future. Whole top bar is hidden by default since -->
    <!-- chili widgets render their own HUD on the LuaUI overlay above. -->
    <span id="hud-entities">Entities: 0</span>
    <span id="hud-frame">Frame: 0</span>
</div>
<!-- Sim speed / pause indicator. Hidden at 1×/unpaused; shows the
     current multiplier when the player has stepped sim speed via
     +/- or paused via Pause. Lives outside #hud-top-bar so it stays
     visible even when chili widgets cover the top bar. -->
<div id="hud-speed" class="hud-panel" style="display:none"></div>
<div id="hud-selection" class="hud-panel" style="display:none">
    <span id="hud-selected">No selection</span>
</div>
<div id="hud-minimap" class="hud-panel" style="display:none">
    <div id="minimap-container"></div>
    <!-- "Pop out", NOT "Detach": this opens the minimap in a second browser
         window (Minimap.detach → window.open). "Detach" is the platform's word
         for parking a game session (detachToLobby / gp:detach), and while this
         button read "Detach ↗" it was the only such-labelled control in the
         Metalstorm HUD — so it read as the way to leave the match, did nothing
         a player could see (the popup opens behind), and was twice diagnosed
         as "detach is broken" (PLAN-endtoend D6/D25). There is still no
         session-detach affordance in the HUD; that gap is D6. -->
    <button id="detach-minimap-btn">Pop out ↗</button>
</div>
<div id="hud-help" class="hud-panel" style="display:none">
    Left click: select &nbsp; Right click: move/attack &nbsp; S: stop &nbsp; Shift: queue &nbsp; ESC: quit
</div>
