<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Spring RTS Web</title>
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      body { background: #1a1a1a; color: #e0e0e0; font-family: system-ui, sans-serif; overflow: hidden; }
      #lobby { display: none; position: absolute; inset: 0; z-index: 10; padding: 2rem; }
      #game-canvas { width: 100vw; height: 100vh; display: block; }
      #status { position: fixed; bottom: 1rem; left: 1rem; font-size: 0.875rem; color: #888; z-index: 100; }
    </style>
  </head>
  <body>
    <div id="lobby"></div>
    <canvas id="game-canvas"></canvas>
    <div id="status">Loading...</div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
