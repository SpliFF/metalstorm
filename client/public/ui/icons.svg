<!--
  icons.svg — the stencilled-steel-plate icon sprite (docs/ui-style.md).

  24 line glyphs, one <symbol> each, 24x24 viewBox, stroke-only (no fills) so
  every icon inherits "color" from its usage site: set it to the nui-text
  token for the resting state, or the nui-gold token for the hazard/selected
  variant. That is the "two-weight" system: the base stroke-width (1.75, set
  on each symbol) is the resting weight; a consumer stylesheet can override it
  with a heavier stroke-width for an emphasised weight (an active tab, a
  selected stance) since a CSS rule always outranks an SVG presentation
  attribute. There is no second hazard-only glyph set: hazard is a colour,
  not a different drawing, so one path serves both. See docs/ui-style.md for
  the full usage pattern.

  Groups (PLAN-beta-presentation.md L-UI-DS step 5):
    unit classes  — the 12 families class-vocabulary.json actually spawns as
                    distinct combat roles (the 12 lightweight variant/support
                    classes — technical, scout, supply, tanker, courier,
                    expedition, command, landing_ship, balloon, sites,
                    civilians, civvehicles — read as re-skinned tanks/ships/
                    buildings on a glyph sprite and are left to the unit's
                    own portrait, not this set)
    objectives    — the 4 visually distinct marker TYPES a player sees on the
                    map (LuaRules/Gadgets/objectives/*.lua has 8 gadgets;
                    attribution/warend/generator/infra are bookkeeping, not
                    a marker a player looks at)
    stances       — the 4-state simplified stance a unit's stance control
                    shows (Spring's separate moveState x fireState bitfield,
                    lua-spring-api.ts:353-354, collapsed to one control the
                    way most RTS HUDs present it)
    menu tabs     — the 4 top-level lobby destinations
-->
<svg xmlns="http://www.w3.org/2000/svg" style="display:none">

<!-- ══ unit classes ══════════════════════════════════════════════════ -->

