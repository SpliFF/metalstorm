<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Spring RTS — Viewport</title>
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      body {
        background: #0a0f0a; color: #e0e0e0;
        font-family: system-ui, sans-serif;
        overflow: hidden;
      }
      #viewport-canvas {
        width: 100vw; height: 100vh; display: block;
        cursor: crosshair;
      }
      #viewport-status {
        position: fixed; bottom: 4px; left: 4px;
        font-size: 10px; color: #555; z-index: 10;
      }
    </style>
  </head>
  <body>
    <canvas id="viewport-canvas"></canvas>
    <div id="viewport-status">Connecting...</div>
    <script type="module" src="/src/viewport.ts"></script>
  </body>
</html>
