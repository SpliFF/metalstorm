procs:
  logserver:
    shell: "./build/debug/spring-logserver --port 8010 --db data/debug.db"
    stop: SIGINT

  lobby:
    shell: "./build/debug/spring-lobby --no-cache --port 8011 --game data/games/papertanks --maps data/maps --games-dir data/games --db data/spring-server.db --dev-direct-start"
    stop: SIGINT

  client:
    shell: "cd client && GAME_SERVER_PORT=8011 npx vite dev --port 8012"

  game-logs:
    shell: "mkdir -p data/logs && tail -F data/logs/game-*.log 2>/dev/null || (echo 'Waiting for game servers...' && sleep 999999)"

  lua-errors:
    shell: "mkdir -p data/logs && tail -F data/logs/game-*.log 2>/dev/null | grep --line-buffered -iE '(error|warning|FATAL)' || (echo 'Watching for Lua errors...' && sleep 999999)"
