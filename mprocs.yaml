# Remote-control server. With this set, the running mprocs listens for
# ctl commands (`mprocs --ctl '{c: ...}'`), so scripts/MCP can restart an
# individual pane WITHOUT killing it out from under mprocs (which would
# leave a dead pane + risk duplicate listeners). `tools/scripts/spring-services.sh
# restart <proc>` drives this. The C++ servers also self-re-exec in place
# (restart_lobby / restart_logserver / restart_game, SIGHUP); the control
# channel is the clean path for the panes that can't — the Vite `client`
# and the log tails. See docs/debugging-tools.md "mprocs Development Environment".
server: 127.0.0.1:4050

procs:
  logserver:
    shell: "./build/debug/spring-logserver --port 8010 --db data/debug.db --i-understand-this-is-a-dev-build"
    stop: SIGINT

  lobby:
    shell: "./build/debug/spring-lobby --no-cache --port 8011 --game data/games/papertanks --maps data/maps --games-dir data/games --db data/spring-server.db --dev-direct-start --i-understand-this-is-a-dev-build"
    stop: SIGINT

  client:
    shell: "cd client && GAME_SERVER_PORT=8011 npx vite dev --port 8012"

  game-logs:
    shell: "mkdir -p data/logs && tail -F data/logs/game-*.log 2>/dev/null || (echo 'Waiting for game servers...' && sleep 999999)"

  lua-errors:
    shell: "mkdir -p data/logs && tail -F data/logs/game-*.log 2>/dev/null | grep --line-buffered -iE '(error|warning|FATAL)' || (echo 'Watching for Lua errors...' && sleep 999999)"
