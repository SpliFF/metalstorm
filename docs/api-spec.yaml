openapi: "3.1.0"
info:
  title: Spring RTS Web API
  version: "1.0.0"
  description: |
    HTTP API for Spring RTS Web servers. All servers support HTTP/2 (h2c
    cleartext) and HTTP/1.1 on the same port, auto-detected from the
    connection preface. For h2c: `curl --http2-prior-knowledge`.

    Three server types share this API:
    - **Lobby** (default port 8011): auth, rooms, maps, processes
    - **Game server** (dynamic port): auth, exec, WebTransport discovery (`/api/wt/info`)
    - **Log server** (default port 8010): log queries, sessions, SSE streaming

servers:
  - url: http://localhost:8011
    description: Lobby server
  - url: http://localhost:{gamePort}
    description: Game server (dynamic port — discover via GET /api/processes on lobby)
  - url: http://localhost:8010
    description: Log server

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      description: Token from POST /api/auth/login
    basicAuth:
      type: http
      scheme: basic
      description: Username and password (validated directly, no login step needed)

  schemas:
    AuthResult:
      type: object
      properties:
        token: { type: string }
        user_id: { type: integer }
        username: { type: string }
        role: { type: string, enum: [admin, player, spectator] }

    ExecResult:
      type: object
      properties:
        success: { type: boolean }
        output: { type: string }

    LogEntry:
      type: object
      properties:
        id: { type: integer }
        timestamp: { type: integer }
        level: { type: integer, minimum: 0, maximum: 5 }
        section: { type: string }
        scope: { type: string }
        process: { type: string }
        message: { type: string }
        frame: { type: integer }

    ProcessInfo:
      type: object
      properties:
        room_id: { type: integer }
        port: { type: integer }
        pid: { type: integer }
        state: { type: string, enum: [starting, running, ended, crashed] }
        map: { type: string }
        game: { type: string }

    Room:
      type: object
      properties:
        id: { type: integer }
        name: { type: string }
        map: { type: string }
        game: { type: string }
        state: { type: integer, description: "0=Configuring, 1=Filling, 2=ReadyCheck, 3=Loading, 4=Active, 5=Ended" }
        players:
          type: array
          items:
            type: object
            properties:
              player_id: { type: integer }
              username: { type: string }
              team: { type: integer }
              ready: { type: boolean }
              is_host: { type: boolean }
              start_pos: { type: integer }
        ai_slots:
          type: array
          items:
            type: object
            properties:
              ai_id: { type: string }
              name: { type: string }
              team: { type: integer }
              start_pos: { type: integer }

    Error:
      type: object
      properties:
        error: { type: string }

paths:
  /api/auth/login:
    post:
      summary: Login with username and password
      tags: [Auth]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [username, password]
              properties:
                username: { type: string }
                password: { type: string }
      responses:
        "200":
          description: Login successful
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AuthResult" }
        "401":
          description: Invalid credentials
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /api/auth/register:
    post:
      summary: Register a new account (auto-login)
      tags: [Auth]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [username, password]
              properties:
                username: { type: string, minLength: 2, maxLength: 32 }
                password: { type: string }
      responses:
        "201":
          description: Account created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AuthResult" }
        "409":
          description: Username taken
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /api/exec:
    post:
      summary: Execute a command in a scope
      tags: [Debug]
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [scope, code]
              properties:
                scope:
                  type: string
                  enum: [LuaRules, LuaGaia, server, lobby, sql]
                code: { type: string }
      responses:
        "200":
          description: Command result
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ExecResult" }
        "401":
          description: Unauthorized
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /api/rooms:
    get:
      summary: List all rooms with full state
      tags: [Rooms]
      responses:
        "200":
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Room" }
    post:
      summary: Create a new room
      tags: [Rooms]
      security: [{ bearerAuth: [] }]
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                name: { type: string, default: "Game" }
                map: { type: string }
                game: { type: string }
      responses:
        "200":
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Room" }

  /api/rooms/join:
    post:
      summary: Join a room
      tags: [Rooms]
      security: [{ bearerAuth: [] }]
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required: [room_id]
              properties:
                room_id: { type: integer }
                password: { type: string }

  /api/rooms/leave:
    post:
      summary: Leave current room
      tags: [Rooms]
      security: [{ bearerAuth: [] }]

  /api/rooms/ready:
    post:
      summary: Set ready state
      tags: [Rooms]
      security: [{ bearerAuth: [] }]
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                ready: { type: boolean }

  /api/rooms/team:
    post:
      summary: Set team assignment
      tags: [Rooms]
      security: [{ bearerAuth: [] }]
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                team: { type: integer, minimum: 0 }

  /api/rooms/startpos:
    post:
      summary: Set start position
      tags: [Rooms]
      security: [{ bearerAuth: [] }]
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                pos: { type: integer }
                target_player_id: { type: integer, description: "Default: self" }

  /api/rooms/kick:
    post:
      summary: Kick a player (host only)
      tags: [Rooms]
      security: [{ bearerAuth: [] }]
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required: [target_player_id]
              properties:
                target_player_id: { type: integer }

  /api/rooms/close:
    post:
      summary: Close/delete a room (host only)
      tags: [Rooms]
      security: [{ bearerAuth: [] }]

  /api/rooms/ai/add:
    post:
      summary: Add an AI slot to the room
      tags: [Rooms]
      security: [{ bearerAuth: [] }]
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required: [ai_id]
              properties:
                ai_id: { type: string }
                name: { type: string }
                team: { type: integer, default: 0 }

  /api/rooms/ai/remove:
    post:
      summary: Remove an AI slot by index
      tags: [Rooms]
      security: [{ bearerAuth: [] }]
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required: [slot_index]
              properties:
                slot_index: { type: integer }

  /api/rooms/start:
    post:
      summary: Start the game (host only, all players must be ready)
      tags: [Rooms]
      security: [{ bearerAuth: [] }]
      responses:
        "200":
          description: Game started, returns room with updated state
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Room" }

  /api/wt/info:
    get:
      summary: WebTransport (QUIC) endpoint discovery
      description: >
        Returns the game server's WebTransport endpoint. The client opens a
        WebTransport session to `https://<host>:<port>/`, pinning the dev cert
        via `serverCertificateHashes`, then authenticates with an AuthRequest
        over the control stream. Replaces the removed `/api/rtc/*` WebRTC
        signaling (GW7, PLAN-game-worker.md).
      tags: [Game]
      responses:
        "200":
          description: WebTransport endpoint
          content:
            application/json:
              schema:
                type: object
                required: [port, certHash, transport]
                properties:
                  port: { type: integer, description: QUIC/UDP port }
                  certHash: { type: string, description: base64 SHA-256 of the dev cert (empty in prod) }
                  transport: { type: string, enum: [webtransport] }

  /api/processes:
    get:
      summary: List game server processes
      tags: [Lobby]
      responses:
        "200":
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/ProcessInfo" }

  /api/maps:
    get:
      summary: List available maps
      tags: [Lobby]
      responses:
        "200":
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  properties:
                    id: { type: string }
                    name: { type: string }

  /api/logs/{roomId}:
    get:
      summary: Get recent log entries
      tags: [Logs]
      parameters:
        - name: roomId
          in: path
          required: true
          schema: { type: integer }
          description: Room ID (0 for all sources)
        - name: limit
          in: query
          schema: { type: integer, default: 200 }
        - name: level
          in: query
          schema: { type: integer, default: 0 }
          description: "Min level (0=DEBUG, 2=NOTICE, 4=ERROR)"
        - name: section
          in: query
          schema: { type: string }
        - name: scope
          in: query
          schema: { type: string }
      responses:
        "200":
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/LogEntry" }

  /api/logs/search:
    get:
      summary: Full-text search across logs
      tags: [Logs]
      parameters:
        - name: q
          in: query
          required: true
          schema: { type: string }
        - name: limit
          in: query
          schema: { type: integer, default: 200 }
        - name: level
          in: query
          schema: { type: integer, default: 0 }

  /api/logs/stream:
    get:
      summary: SSE stream for real-time log delivery
      description: |
        Server-Sent Events endpoint. Connect via EventSource for continuous
        log streaming. Events have type "log" with JSON data containing
        level, section, and message fields. Replaces polling /api/logs/{roomId}.
      tags: [Logs]
      responses:
        "200":
          description: SSE event stream
          content:
            text/event-stream:
              schema:
                type: string
                description: "SSE events with type 'log' and JSON data"

  /api/sessions:
    get:
      summary: List recent game sessions
      tags: [Logs]
      responses:
        "200":
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  properties:
                    session_id: { type: string }
                    room_id: { type: integer }
                    game_name: { type: string }
                    map_name: { type: string }
                    started_at: { type: integer }
                    ended_at: { type: integer }
                    end_reason: { type: string }
                    exit_code: { type: integer }
