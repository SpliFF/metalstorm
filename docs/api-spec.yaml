openapi: "3.1.0"
info:
  title: Spring RTS Web API
  version: "1.1.0"
  description: |
    HTTP API for Spring RTS Web servers. All servers support HTTP/2 (h2c
    cleartext) and HTTP/1.1 on the same port, auto-detected from the
    connection preface. For h2c: `curl --http2-prior-knowledge`.

    Three server types share this API:
    - **Lobby** (default port 8011): auth, rooms, maps, processes
    - **Game server** (dynamic port): auth, exec, WebTransport discovery (`/api/wt/info`)
    - **Log server** (default port 8010): log queries, sessions, SSE streaming

servers:
  - url: http://localhost:8011
    description: Lobby server
  - url: http://localhost:{gamePort}
    description: Game server (dynamic port — discover via GET /api/processes on lobby)
  - url: http://localhost:8010
    description: Log server

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      description: Token from POST /api/auth/login
    basicAuth:
      type: http
      scheme: basic
      description: Username and password (validated directly, no login step needed)

  parameters:
    worldQuery:
      name: world
      in: query
      required: false
      schema: { type: string }
      description: >
        World id. Honoured by every /api/world* route, GET and POST alike;
        defaults to the lobby's primary (oldest active) world.
  schemas:
    AuthResult:
      type: object
      properties:
        token: { type: string }
        user_id: { type: integer }
        username: { type: string }
        role: { type: string, enum: [admin, player, spectator] }

    ExecResult:
      type: object
      properties:
        success: { type: boolean }
        output: { type: string }

    LogEntry:
      type: object
      properties:
        id: { type: integer }
        timestamp: { type: integer }
        level: { type: integer, minimum: 0, maximum: 5 }
        section: { type: string }
        scope: { type: string }
        process: { type: string }
        message: { type: string }
        frame: { type: integer }

    ProcessInfo:
      type: object
      properties:
        room_id: { type: integer }
        port: { type: integer }
        pid: { type: integer }
        state: { type: string, enum: [starting, running, ended, crashed] }
        map: { type: string }
        game: { type: string }

    Room:
      type: object
      properties:
        id: { type: integer }
        name: { type: string }
        map: { type: string }
        game: { type: string }
        state: { type: integer, description: "0=Configuring, 1=Filling, 2=ReadyCheck, 3=Loading, 4=Active, 5=Ended" }
        players:
          type: array
          items:
            type: object
            properties:
              player_id: { type: integer }
              username: { type: string }
              team: { type: integer }
              ready: { type: boolean }
              is_host: { type: boolean }
              start_pos: { type: integer }
        ai_slots:
          type: array
          items:
            type: object
            properties:
              ai_id: { type: string }
              name: { type: string }
              team: { type: integer }
              start_pos: { type: integer }
              profile: { type: string }

    Error:
      type: object
      properties:
        error: { type: string }

    SessionResult:
      description: AuthResult plus session lifetime fields (refresh/guest/upgrade paths)
      allOf:
        - $ref: "#/components/schemas/AuthResult"
        - type: object
          properties:
            faction: { type: string }
            expires_in: { type: integer, description: Access-token lifetime in seconds }
            refresh_token: { type: string }
            provisional: { type: boolean }

    OkResult:
      type: object
      properties:
        ok: { type: boolean }

paths:
  /api/auth/login:
    post:
      summary: Login with username and password
      tags: [Auth]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [username, password]
              properties:
                username: { type: string }
                password: { type: string }
      responses:
        "200":
          description: Login successful
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AuthResult" }
        "401":
          description: Invalid credentials
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /api/auth/register:
    post:
      summary: Register a new account (auto-login)
      tags: [Auth]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [username, password]
              properties:
                username: { type: string, minLength: 2, maxLength: 32 }
                password: { type: string }
      responses:
        "201":
          description: Account created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AuthResult" }
        "409":
          description: Username taken
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /api/auth/validate:
    post:
      summary: Check whether the Authorization header's token is still valid
      tags: [Auth]
      security: [{ bearerAuth: [] }, { basicAuth: [] }]
      responses:
        "200":
          description: "Valid — {valid, user_id, username, role, faction?, totp_enabled, expires_in? (remaining life, Bearer only)}"
        "401":
          description: Invalid or expired token

  /api/auth/refresh:
    post:
      summary: Rotate a refresh token into a new access session
      tags: [Auth]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [refresh_token]
              properties:
                refresh_token: { type: string }
      responses:
        "200":
          description: New session (login shape plus a rotated refresh_token)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SessionResult" }
        "401": { description: Invalid, expired or reused refresh token }
        "403": { description: Account banned (all refresh tokens revoked) }
        "429": { description: Too many failed refresh attempts }

  /api/auth/logout-all:
    post:
      summary: Revoke every session and refresh family for the account
      tags: [Auth]
      security: [{ bearerAuth: [] }]
      responses:
        "200":
          description: "{ok, sessions_revoked, refresh_revoked}"

  /api/auth/guest:
    post:
      summary: Mint a provisional (guest) account and its device token
      tags: [Auth]
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                faction: { type: string, description: Optional — a factionless guest spectates }
      responses:
        "201":
          description: "Session plus provisional:true and device_token (the guest's only long-lived credential)"
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SessionResult" }
        "400": { description: Unknown faction }
        "429": { description: Rate limited }

  /api/auth/guest/resume:
    post:
      summary: Trade a guest device token for a fresh session
      tags: [Auth]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [device_token]
              properties:
                device_token: { type: string }
      responses:
        "200":
          description: Fresh session (no refresh token — the device token is the long-lived credential)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SessionResult" }
        "401": { description: Invalid/expired device token, or the account has upgraded }
        "403": { description: Account banned }

  /api/auth/upgrade:
    post:
      summary: Upgrade a guest to a full account in place (progress kept)
      tags: [Auth]
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [password]
              properties:
                username: { type: string, description: "Defaults to the guest name; cannot start with 'guest-'" }
                password: { type: string, minLength: 8 }
                faction: { type: string, description: Required if the account has none }
      responses:
        "200":
          description: New session + first refresh family; device token spent
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SessionResult" }
        "400": { description: Missing/weak password, bad username, unknown/missing faction }
        "409": { description: Already a full account, name taken, or name in use (leave your game first) }

  /api/auth/totp/enroll:
    post:
      summary: Begin TOTP enrolment (mint pending secret + otpauth URI)
      tags: [Auth]
      security: [{ bearerAuth: [] }]
      responses:
        "200": { description: "{secret, uri, digits, period}" }
        "409": { description: Already enabled, or provisional account (upgrade first) }

  /api/auth/totp/confirm:
    post:
      summary: Confirm the authenticator and enable TOTP
      tags: [Auth]
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [code]
              properties:
                code: { type: string }
      responses:
        "200": { description: "{ok, enabled:true, recovery_codes:[...]} — the only time the codes exist" }
        "401": { description: Invalid code }
        "409": { description: No pending enrolment / already enabled }

  /api/auth/totp/disable:
    post:
      summary: Disable TOTP (costs the password AND a current or recovery code)
      tags: [Auth]
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [password, code]
              properties:
                password: { type: string }
                code: { type: string }
      responses:
        "200": { description: "{ok, enabled:false}" }
        "401": { description: Bad password or bad code }

  /api/auth/totp/status:
    post:
      summary: TOTP status for the account
      tags: [Auth]
      security: [{ bearerAuth: [] }]
      responses:
        "200": { description: "{enabled, pending, recovery_remaining}" }

  /api/world:
    get:
      summary: World clock + meta (with active season folded on)
      description: >
        Every /api/world* route (GET and POST) takes an optional `?world=<id>`
        query parameter, defaulting to the primary (oldest active) world.
        Shared errors: 503 world_database_unavailable, 404 no_world, 401
        unauthorized on token routes, 403 not_in_a_faction on the routes that
        act for a faction. Design of record: docs/world-layer.md; response
        shapes: docs/api.md "World layer".
      tags: [World]
      parameters:
        - $ref: '#/components/parameters/worldQuery'
      responses:
        "200": { description: "{worldId, name, state, createdAt, config, clock:{realMs, worldMs, epochRealMs, epochWorldMs, runningRealMs, pausedRealMs, paused, ratioNum, ratioDen, day, hour, minute, second, label}, poiCount, season|null}" }
        "404": { description: No such world }
        "503": { description: World database unavailable }

  /api/world/pois:
    get:
      summary: POI graph (nodes + edges) with battle, faction and staging state merged on
      tags: [World]
      parameters:
        - $ref: '#/components/parameters/worldQuery'
      responses:
        "200": { description: "{worldId, pois[]{…, battleStatus, warRoomId, staging[]}, edges[], factions{}} (empty arrays for a young world)" }

  /api/world/stats:
    get:
      summary: Rates in force, commander Authority, faction rosters with derived Rank
      tags: [World]
      parameters:
        - $ref: '#/components/parameters/worldQuery'
      responses:
        "200": { description: "{worldId, rules, accrued, commanders[], factions[]{members[]{rank}, rankTotal}, economy} — see docs/api.md; settles commander authority accrual idempotently on read" }

  /api/world/factions:
    get:
      summary: Faction roster + archetype catalogue + founding rules
      tags: [World]
      parameters:
        - $ref: '#/components/parameters/worldQuery'
      responses:
        "200": { description: "{worldId, factions[], archetypes[], rules} — see docs/api.md" }

  /api/world/me:
    post:
      summary: This account's standing in one world (authority, membership, sideKey, stats)
      tags: [World]
      parameters:
        - $ref: '#/components/parameters/worldQuery'
      security: [{ bearerAuth: [] }]
      responses:
        "200": { description: "{worldId, accountId, authority, canFound, membership|null, sideKey|null, commanderGranted, accrued, commanders[], capacity{}, rank{}, statRules} — grants the starter commander on first eligible read" }

  /api/world/factions/found:
    post:
      summary: Found a world faction (side key read from the account, never the body)
      tags: [World]
      parameters:
        - $ref: '#/components/parameters/worldQuery'
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, archetype]
              properties:
                name: { type: string }
                archetype: { type: string }
                governance: { type: string }
                colour: { type: string }
                seatPoi: { type: string }
      responses:
        "200": { description: "{ok, factionId, authority} — authority is what remains after the spend" }
        "400": { description: bad_name / bad_archetype / bad_seat }
        "403": { description: "insufficient_authority (with have/need)" }
        "409": { description: name_taken / already_member / seat_taken }
        "500": { description: db_error }

  /api/world/factions/join:
    post:
      summary: Join an existing faction (enforces the account/faction side-key seam)
      tags: [World]
      parameters:
        - $ref: '#/components/parameters/worldQuery'
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [factionId]
              properties:
                factionId: { type: string }
      responses:
        "200": { description: "{ok, factionId, sideKeyAdopted}" }
        "400": { description: bad_request (factionId missing) }
        "404": { description: no_such_faction }
        "409": { description: "side_mismatch (with accountSideKey/factionSideKey) / already_member" }

  /api/world/factions/leave:
    post:
      summary: Leave the caller's faction in this world (no-op reported, never an error)
      tags: [World]
      parameters:
        - $ref: '#/components/parameters/worldQuery'
      security: [{ bearerAuth: [] }]
      responses:
        "200": { description: "{ok, left}" }

  /api/world/claims:
    get:
      summary: Every claim in the world plus the conquest rates in force
      tags: [World]
      parameters:
        - $ref: '#/components/parameters/worldQuery'
      responses:
        "200": { description: "{worldId, rules{claimPoiCost, claimRefundFraction, claimExpiryWorldMs}, claims[]}" }

  /api/world/claims/file:
    post:
      summary: File a conquest claim on a POI (charges the caller's authority)
      tags: [World]
      parameters:
        - $ref: '#/components/parameters/worldQuery'
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [poi]
              properties:
                poi: { type: string }
      responses:
        "200": { description: "{ok, claim}" }
        "403": { description: "insufficient_authority (with have/need)" }
        "403": { description: not_in_a_faction }
        "404": { description: no_poi / no_faction }
        "409": { description: already_owner / already_claimed }
        "500": { description: db_error }

  /api/world/claims/withdraw:
    post:
      summary: Withdraw an open claim (any member of the claiming faction)
      tags: [World]
      parameters:
        - $ref: '#/components/parameters/worldQuery'
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [claimId]
              properties:
                claimId: { type: integer }
      responses:
        "200": { description: "{ok, withdrawn} — withdrawn:false when a settlement already resolved it" }
        "403": { description: not_your_claim }
        "404": { description: no_claim }

  /api/world/staging/commit:
    post:
      summary: Commit force at a POI (opens/joins a staging window; escrows the force)
      tags: [World]
      parameters:
        - $ref: '#/components/parameters/worldQuery'
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [poi]
              properties:
                poi: { type: string }
                transports: { type: integer, default: 1 }
                squads: { type: integer, default: 1 }
                origin: { type: string }
      responses:
        "200": { description: "{ok, joined, staging} — staging is one pois[].staging[] item" }
        "400": { description: no_transport / no_squads / no_battle_map }
        "403": { description: not_in_a_faction }
        "404": { description: no_poi / no_world / no_faction }
        "409": { description: already_held }
        "500": { description: db_error }

  /api/world/staging/cancel:
    post:
      summary: Withdraw a commitment before contact (refunds the escrow)
      tags: [World]
      parameters:
        - $ref: '#/components/parameters/worldQuery'
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [stagingId]
              properties:
                stagingId: { type: integer }
      responses:
        "200": { description: "{ok, cancelled} — cancelled:false when the window had already closed" }
        "403": { description: not_your_commitment }
        "404": { description: no_staging }

  /api/world/pause:
    post:
      summary: Admin global world-clock pause/resume (battles keep running)
      tags: [World]
      parameters:
        - $ref: '#/components/parameters/worldQuery'
      security: [{ bearerAuth: [] }]
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                action: { type: string, enum: [pause, resume], default: pause }
                reason: { type: string }
      responses:
        "200": { description: "{ok, changed, clock} — changed:false when already in the requested state" }
        "400": { description: bad_action }
        "403": { description: Admin role required }

  /api/world/seasons:
    get:
      summary: Season archive index (newest first)
      tags: [World]
      parameters:
        - $ref: '#/components/parameters/worldQuery'
      responses:
        "200": { description: "{worldId, seasons[]{number, state, seasonId, startedWorldMs, endedWorldMs}}" }

  /api/world/seasons/{n}:
    get:
      summary: One season plus its archived digest rows
      tags: [World]
      parameters:
        - $ref: '#/components/parameters/worldQuery'
        - name: n
          in: path
          required: true
          schema: { type: integer }
          description: Season number — digits only ("latest" is not a route)
      responses:
        "200": { description: Season + digests (an active season has an empty digests array) }
        "404": { description: no_such_season }

  /api/world/push/key:
    get:
      summary: Web Push availability + the VAPID public key
      tags: [World]
      parameters:
        - $ref: '#/components/parameters/worldQuery'
      responses:
        "200": { description: "{worldId, enabled, publicKey}" }

  /api/world/push/subscribe:
    post:
      summary: Store this account's browser push subscription (PushSubscription.toJSON shape)
      tags: [World]
      parameters:
        - $ref: '#/components/parameters/worldQuery'
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [endpoint, keys]
              properties:
                endpoint: { type: string }
                keys:
                  type: object
                  properties:
                    p256dh: { type: string }
                    auth: { type: string }
      responses:
        "201": { description: Stored (insert-or-replace on world/account/endpoint) }
        "400": { description: bad_subscription }
        "500": { description: store_failed }

  /api/world/push/unsubscribe:
    post:
      summary: Drop one of this account's push subscriptions
      tags: [World]
      parameters:
        - $ref: '#/components/parameters/worldQuery'
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [endpoint]
              properties:
                endpoint: { type: string }
      responses:
        "200":
          content:
            application/json:
              schema: { $ref: "#/components/schemas/OkResult" }

  /api/wars/deploy:
    post:
      summary: '"Which war should I fight in?" — ranks, reserves a slot, or seeds a new war'
      tags: [Wars]
      security: [{ bearerAuth: [] }]
      responses:
        "200":
          description: >
            {outcome, faction, underdog_by, room_id?, room_name?, seeded?,
            seed_error?, reservation?, reservation_expires_in?, incentivised?,
            rejoin_fell_through?} — answers, never refuses.

  /api/wars/join-preview:
    post:
      summary: Per-account join preview for every live persistent war (body ignored)
      tags: [Wars]
      security: [{ bearerAuth: [] }]
      responses:
        "200":
          description: >
            Array of {room_id, watching, will_fight, reason, team, side,
            humans_on_side, capacity_per_side, authority, authority_source,
            returning, enlisted, seat, digest?, digest_total?, away_sec?}.

  /api/wars/reconnect-token:
    post:
      summary: Mint a long-TTL single-war reconnect key (seat holders only)
      tags: [Wars]
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [room_id]
              properties:
                room_id: { type: integer }
      responses:
        "200": { description: "{room_id, token, expires_in}" }
        "400": { description: Bad room_id, or not a persistent war }
        "403": { description: No seat held in this war }
        "404": { description: No such room }

  /api/exec:
    post:
      summary: Execute a command in a scope
      tags: [Debug]
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [scope, code]
              properties:
                scope:
                  type: string
                  enum: [LuaRules, LuaGaia, server, lobby, sql]
                code: { type: string }
      responses:
        "200":
          description: Command result
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ExecResult" }
        "401":
          description: Unauthorized
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /api/rooms:
    get:
      summary: List all rooms with full state
      tags: [Rooms]
      responses:
        "200":
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Room" }
    post:
      summary: Create a new room
      tags: [Rooms]
      security: [{ bearerAuth: [] }]
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                name: { type: string, default: "Game" }
                map: { type: string }
                game: { type: string }
      responses:
        "200":
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Room" }

  /api/rooms/join:
    post:
      summary: Join a room
      tags: [Rooms]
      security: [{ bearerAuth: [] }]
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required: [room_id]
              properties:
                room_id: { type: integer }
                password: { type: string }

  /api/rooms/leave:
    post:
      summary: Leave current room
      tags: [Rooms]
      security: [{ bearerAuth: [] }]

  /api/rooms/ready:
    post:
      summary: Set ready state
      tags: [Rooms]
      security: [{ bearerAuth: [] }]
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                ready: { type: boolean }

  /api/rooms/team:
    post:
      summary: Set team assignment
      tags: [Rooms]
      security: [{ bearerAuth: [] }]
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                team: { type: integer, minimum: 0 }

  /api/rooms/startpos:
    post:
      summary: Set start position
      tags: [Rooms]
      security: [{ bearerAuth: [] }]
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                pos: { type: integer }
                target_player_id: { type: integer, description: "Default: self" }

  /api/rooms/kick:
    post:
      summary: Kick a player (host only)
      tags: [Rooms]
      security: [{ bearerAuth: [] }]
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required: [target_player_id]
              properties:
                target_player_id: { type: integer }

  /api/rooms/ai/add:
    post:
      summary: Add an AI slot to the room
      tags: [Rooms]
      security: [{ bearerAuth: [] }]
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required: [ai_id]
              properties:
                ai_id: { type: string }
                name: { type: string }
                team: { type: integer, default: 0 }
                profile:
                  type: string
                  description: >
                    Optional personality/difficulty profile for AI plugins
                    that support one (PLAN-metalstorm-ai.md §10 task 6).
                    Equivalent to adding the slot then calling
                    /api/rooms/ai/profile.

  /api/rooms/ai/remove:
    post:
      summary: Remove an AI slot by index
      tags: [Rooms]
      security: [{ bearerAuth: [] }]
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required: [slot_index]
              properties:
                slot_index: { type: integer }

  /api/rooms/ai/team:
    post:
      summary: Reassign an AI slot to a different team (host only)
      tags: [Rooms]
      security: [{ bearerAuth: [] }]
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required: [slot_index, team]
              properties:
                slot_index: { type: integer }
                team: { type: integer }

  /api/rooms/ai/profile:
    post:
      summary: >
        Set (or, with profile:"", clear) an AI slot's personality/difficulty
        profile (host only). PLAN-metalstorm-ai.md §10 task 6 — profiles
        move planner scoring/commitment/budget-governor behaviour, never
        fog or per-unit accuracy. `profile` is opaque, game-specific text
        (Metalstorm's strategos ships "default"/"aggressive"/"caretaker"/
        "mentor"/"npc_raider" — see ai/strategos/config.lua's
        Config.PROFILES); the engine only carries it through to the AI VM,
        which validates it.
      tags: [Rooms]
      security: [{ bearerAuth: [] }]
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required: [slot_index]
              properties:
                slot_index: { type: integer }
                profile: { type: string }

  /api/rooms/start:
    post:
      summary: Start the game (host only, all players must be ready)
      tags: [Rooms]
      security: [{ bearerAuth: [] }]
      responses:
        "200":
          description: Game started, returns room with updated state
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Room" }

  /api/client-errors:
    post:
      summary: Submit a client-side crash/fatal report
      description: >
        PLAN-client-resilience.md task 3. The client's watchdog/context-loss/
        fatal-error hooks POST here; size-capped at 40KB, rate-limited to
        20/hour/user server-side (the client's own advisory cap is 5/hour per
        session). Disabled server-wide with the lobby's
        `--disable-client-error-reports` flag (surfaced via `errorReportingEnabled`
        on `/api/version`).
      tags: [Client]
      security: [{ bearerAuth: [] }]
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                reason: { type: string, enum: [fatal, wedged, contextLost, messageError, injected] }
                error_class: { type: string }
                message: { type: string }
                stack: { type: string }
                stack_hash: { type: string }
                recovery_rung: { type: string }
                phase: { type: string }
                frame: { type: integer }
                entity_count: { type: integer }
                game_id: { type: string }
                map_id: { type: string }
                build_stamp: { type: string }
                gpu_renderer: { type: string }
                log_ring: { type: array, items: { type: string } }
                count: { type: integer }
      responses:
        "200":
          description: Report stored
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok: { type: boolean }
                  id: { type: integer }
        "413":
          description: Report exceeds the size cap
        "429":
          description: Rate limited (20/hour/user)

  /api/wt/info:
    get:
      summary: WebTransport (QUIC) endpoint discovery
      description: >
        Returns the game server's WebTransport endpoint. The client opens a
        WebTransport session to `https://<host>:<port>/`, pinning the dev cert
        via `serverCertificateHashes`, then authenticates with an AuthRequest
        over the control stream. Replaces the removed `/api/rtc/*` WebRTC
        signaling (GW7, PLAN-game-worker.md).
      tags: [Game]
      responses:
        "200":
          description: WebTransport endpoint
          content:
            application/json:
              schema:
                type: object
                required: [port, certHash, transport]
                properties:
                  port: { type: integer, description: QUIC/UDP port }
                  certHash: { type: string, description: base64 SHA-256 of the dev cert (empty in prod) }
                  transport: { type: string, enum: [webtransport] }

  /api/processes:
    get:
      summary: List game server processes
      tags: [Lobby]
      responses:
        "200":
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/ProcessInfo" }

  /api/maps:
    get:
      summary: List available maps
      tags: [Lobby]
      responses:
        "200":
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  properties:
                    id: { type: string }
                    name: { type: string }

  /api/logs/{roomId}:
    get:
      summary: Get recent log entries
      tags: [Logs]
      parameters:
        - name: roomId
          in: path
          required: true
          schema: { type: integer }
          description: Room ID (0 for all sources)
        - name: limit
          in: query
          schema: { type: integer, default: 200 }
        - name: level
          in: query
          schema: { type: integer, default: 0 }
          description: "Min level (0=DEBUG, 2=NOTICE, 4=ERROR)"
        - name: section
          in: query
          schema: { type: string }
        - name: scope
          in: query
          schema: { type: string }
      responses:
        "200":
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/LogEntry" }

  /api/logs/search:
    get:
      summary: Full-text search across logs
      tags: [Logs]
      parameters:
        - name: q
          in: query
          required: true
          schema: { type: string }
        - name: limit
          in: query
          schema: { type: integer, default: 200 }
        - name: level
          in: query
          schema: { type: integer, default: 0 }

  /api/logs/stream:
    get:
      summary: SSE stream for real-time log delivery
      description: |
        Server-Sent Events endpoint. Connect via EventSource for continuous
        log streaming. Events have type "log" with JSON data containing
        level, section, and message fields. Replaces polling /api/logs/{roomId}.
      tags: [Logs]
      responses:
        "200":
          description: SSE event stream
          content:
            text/event-stream:
              schema:
                type: string
                description: "SSE events with type 'log' and JSON data"

  /api/sessions:
    get:
      summary: List recent game sessions
      tags: [Logs]
      responses:
        "200":
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  properties:
                    session_id: { type: string }
                    room_id: { type: integer }
                    game_name: { type: string }
                    map_name: { type: string }
                    started_at: { type: integer }
                    ended_at: { type: integer }
                    end_reason: { type: string }
                    exit_code: { type: integer }
